RIGHT             seek  1.5 exact
LEFT              seek -1.5 exact
WHEEL_UP          add volume 2
WHEEL_DOWN        add volume -2
UP                add volume 2
DOWN              add volume -2
MBTN_RIGHT        cycle pause
Shift+MBTN_RIGHT  script-binding  select/context-menu
h                 script-binding  memo-history
g                 script-binding  toggle-gpu-effects
a                 cycle-values    af "acompressor=ratio=4,loudnorm" ""