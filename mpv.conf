#Quality-focused mpv config specifically for the LG 39GX950B (5120x2160@165Hz) and high-end AMD hardware. 
#Tuned for HDR playback with some anime specific settings; used together with UOSC.
#Provided as-is based on my knowledge/experience and what I've found online. <link> was used as a starting point.

#GENERAL
#pause=yes
keep-open=yes
save-position-on-quit=yes
autofit=70%

#OSD/OSC
osc=no
osd-bar=no
border=no
keepaspect-window=yes
cursor-autohide=400

#SCREENSHOTS (directories set in OS profiles at the bottom)
screenshot-template="%F-%wH-%wM-%wS-%wT-%n"
screenshot-format=jxl
screenshot-png-compression=9
screenshot-jxl-distance=0.1
screenshot-jxl-effort=9
screenshot-tag-colorspace=no        #yes results in very dark screenshots
screenshot-high-bit-depth=yes

#VIDEO (OS specific HWdec set in OS profiles at the bottom)
profile=gpu-hq
vo=gpu-next
gpu-api=vulkan
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
dither-depth=10
dither=error-diffusion
error-diffusion=sierra-lite
#video-sync=display-resample        # disabled to prevent stuttering for now

#SCALING (content aware upscaling is done with profiles)
scale=ewa_lanczossharp
dscale=catmull_rom
cscale=ewa_lanczossharp

#AUDIO
volume-max=120
audio-samplerate=192000
audio-resample-filter-size=28
audio-resample-linear=yes
audio-resample-cutoff=0
audio-format=float
audio-buffer=0.2
audio-channels=stereo
audio-file-auto=fuzzy
alang=eng-sdh,en-sdh,eng,en,en-US,en-GB,pl-SDH,pl

#SUBTITLES
subs-with-matching-audio=yes
slang=enm,en,eng,pl,pol,ja,jp,jpn
sub-auto=fuzzy
sub-file-paths=**

#custom sub style, press 'u' when playing
sub-use-margins=yes
stretch-image-subs-to-screen=yes 
sub-font="Trebuchet MS"
sub-bold=yes
sub-font-size=48
sub-blur=0.0
sub-color=1.0/1.0/1.0/1.0           # R-G-B-Alpha
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=2.2
sub-margin-x=100
sub-margin-y=36
sub-shadow-color=0.0/0.0/0.0/0.0
sub-shadow-offset=0
sub-ass-override=yes

#CACHE/SEEK
hr-seek=always
hr-seek-framedrop=no
cache=yes
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=1024MiB
cache-secs=360
demuxer-seekable-cache=yes
demuxer-readahead-secs=360
priority=high
force-seekable=yes
demuxer-mkv-subtitle-preroll=yes

#DEBAND - hotkey only ('b')
deband=no
deband-iterations=4
deband-threshold=48
deband-range=24
deband-grain=4

#PROFILES - General
[720P]
profile-cond=((width <= 1280) and get("video-params/primaries") == "bt.709") and string.match(get("path", ""):lower(), "anime") == nil
profile-restore=copy
target-prim=dci-p3
glsl-shaders="~~/shaders/FSR.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[1080P]
profile-cond=((width > 1280 and width <= 1920) and get("video-params/primaries") == "bt.709") and string.match(get("path", ""):lower(), "anime") == nil
profile-restore=copy
target-prim=dci-p3
glsl-shaders="~~/shaders/FSR.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[1440P]
profile-cond=((width > 1920 and width <= 2560) and get("video-params/primaries") == "bt.709") and string.match(get("path", ""):lower(), "anime") == nil
profile-restore=copy
target-prim=dci-p3
glsl-shaders="~~/shaders/FSR.glsl"
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"

[4KSDR]
profile-cond=((width > 2560) and get("video-params/primaries") == "bt.709") and string.match(get("path", ""):lower(), "anime") == nil
profile-restore=copy
target-prim=dci-p3

[4KHDR]
profile-cond=((width > 2560) and get("video-params/primaries") == "bt.2020") and string.match(get("path", ""):lower(), "anime") == nil
profile-restore=copy
target-colorspace-hint=yes
target-contrast=inf
tone-mapping=spline
gamut-mapping-mode=perceptual

#PROFILES - Anime specific - looks for 'anime' somewhere in the path
[Anime-GENERAL]
profile-cond=(string.match(get("path", ""):lower(), "anime") ~= nil) and (width <= 1920)
profile-restore=copy
glsl-shaders="~~/shaders/ArtCNN_C4F32.glsl"

[AnimeLanguageSwitch]
profile-cond=string.match(get("path", ""):lower(), "anime") ~= nil
profile-restore=copy
alang=ja,jpn,jp,chi,zho,zh,chs,sc,cht,tc,eng,en
sub-ass-override=no

#PROFILES - OS Specific Settings
[Windows]
profile-cond=get("working-directory", ""):match("^%a:") ~= nil
profile-restore=copy
screenshot-dir="C:/Users/Vell/Pictures/MPV-screenshots"
hwdec=d3d11va-copy

[Linux]
profile-cond=get("working-directory", ""):match("^/") ~= nil
profile-restore=copy
screenshot-dir="~/Pictures/MPV-screenshots"
hwdec=vaapi