# Quality-focused mpv config for 4K OLED panels and high-end AMD hardware.
# Tuned for HDR playback with some anime-specific settings; used together with uosc.
# Includes an optimized profile targeted at low-power laptops.
# Provided as-is based on my experience and findings.

# My full setup that this config was fine-tuned for:
# PC: CachyOS - KDE Plasma - Wayland - Limine - 7800X3D - 6950XT - 64GB DDR5 6000MT/s 
#     ASUS ROG XG32UCWMG 4K@240Hz w/HDR + Gigabyte M32Q@1440p120Hz
# Laptop: CachyOS - KDE Plasma - Wayland - Limine - 13500T - Intel Iris Xe - 32GB DDR5 4800MT/s - 2560x1600@60Hz

# 'video-sync=display-resample' instead of 'audio' causes frame drops due to other demanding settings;
# current settings max out my 6950XT usage at around 90% for standard anime 1080p content.

# GENERAL
save-position-on-quit=yes

# WINDOW/UI
keep-open=yes
keepaspect-window=yes
wayland-configure-bounds=yes
hidpi-window-scale=yes
border=no
osc=no
osd-bar=no
cursor-autohide=400

# SCREENSHOTS (directories set in OS profiles at the bottom)
screenshot-template="%F-%wH-%wM-%wS-%wT-%n"
screenshot-format=jxl
screenshot-png-compression=9
screenshot-jxl-distance=0.1
screenshot-jxl-effort=9
screenshot-tag-colorspace=no
screenshot-high-bit-depth=yes

# VIDEO (OS-specific HWdec set in OS profiles at the bottom)
vo=gpu-next
gpu-api=vulkan
vulkan-async-compute=yes
vulkan-async-transfer=yes
video-sync=audio
dither-depth=10
dither=error-diffusion
error-diffusion=sierra-lite

# SCALING (content-aware upscaling is done with profiles)
scale=ewa_lanczossharp
dscale=catmull_rom
cscale=ewa_lanczossharp
linear-downscaling=no
glsl-shaders-append="~~/shaders/SSimDownscaler.glsl"

# AUDIO
volume-max=120
audio-channels=stereo
audio-file-auto=fuzzy
audio-exclusive=no
audio-resample-filter-size=28
audio-resample-cutoff=0
alang=eng-sdh,en-sdh,eng,en,en-US,en-GB,pl-SDH,pl

# SUBTITLES
subs-with-matching-audio=yes
slang=enm,en,eng,pl,pol,ja,jp,jpn
sub-auto=fuzzy
sub-file-paths=**

# Custom subtitle style, press 'u' when playing
sub-use-margins=yes
stretch-image-subs-to-screen=yes
sub-font="Trebuchet MS"
sub-bold=yes
sub-font-size=42
sub-blur=0.0
sub-color=0.9/0.9/0.9/1.0           # R-G-B-Alpha
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=3.6
sub-margin-x=100
sub-margin-y=36
sub-shadow-color=0.0/0.0/0.0/0.0
sub-shadow-offset=0
sub-ass-override=yes

# CACHE/SEEK
hr-seek=always
hr-seek-framedrop=no
cache=yes
demuxer-max-bytes=2048MiB
demuxer-max-back-bytes=1024MiB
cache-secs=360
demuxer-seekable-cache=yes
demuxer-readahead-secs=360
force-seekable=yes
demuxer-mkv-subtitle-preroll=yes

# DEBAND - hotkey only ('b')
deband=no
deband-iterations=4
deband-threshold=48
deband-range=24
deband-grain=4

# PROFILES - General
[Laptop] # Optimized for Intel Iris Xe laptops
profile-cond=((function() local f=io.open('/sys/class/power_supply/BAT0/type') or io.open('/sys/class/power_supply/BAT1/type'); if f then f:close() return true end return false end)())
profile-restore=copy
scale=ewa_lanczos
dscale=catmull_rom
cscale=spline36
correct-downscaling=yes
sigmoid-upscaling=yes
glsl-shaders="~~/shaders/CfL_Prediction.glsl"
dither=fruit
dither-depth=auto
hwdec=vaapi
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
cache-secs=60
demuxer-readahead-secs=60

[SDR-Upscale]
profile-cond=((function() local f=io.open('/sys/class/power_supply/BAT0/type') or io.open('/sys/class/power_supply/BAT1/type'); if f then f:close() return false end return true end)()) and (width < 3840) and (get("video-params/gamma", "") ~= "pq") and (get("video-params/gamma", "") ~= "hlg") and (get("video-params/primaries", "") ~= "bt.2020") and (string.match((get("working-directory", "") .. "/" .. get("path", "")):lower():match("^(.*)[/\\]") or "", "anime") == nil)
profile-restore=copy
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
target-gamut=dci-p3

[4KSDR]
profile-cond=((function() local f=io.open('/sys/class/power_supply/BAT0/type') or io.open('/sys/class/power_supply/BAT1/type'); if f then f:close() return false end return true end)()) and ((width > 3839) and get("video-params/primaries") == "bt.709") and (string.match((get("working-directory", "") .. "/" .. get("path", "")):lower():match("^(.*)[/\\]") or "", "anime") == nil)
profile-restore=copy
target-gamut=dci-p3

[4KHDR]
profile-cond=((function() local f=io.open('/sys/class/power_supply/BAT0/type') or io.open('/sys/class/power_supply/BAT1/type'); if f then f:close() return false end return true end)()) and ((width > 3839) and get("video-params/primaries") == "bt.2020") and (string.match((get("working-directory", "") .. "/" .. get("path", "")):lower():match("^(.*)[/\\]") or "", "anime") == nil)
profile-restore=copy
target-colorspace-hint=yes
target-contrast=inf 
tone-mapping=bt.2446a
hdr-contrast-recovery=0.30
gamut-mapping-mode=perceptual 

# PROFILES - Anime specific (checks folder path for 'anime')
[Anime-GENERAL]
profile-cond=((function() local f=io.open('/sys/class/power_supply/BAT0/type') or io.open('/sys/class/power_supply/BAT1/type'); if f then f:close() return false end return true end)()) and (string.match((get("working-directory", "") .. "/" .. get("path", "")):lower():match("^(.*)[/\\]") or "", "anime") ~= nil) and (width <= 1920)
profile-restore=copy
target-gamut=dci-p3
glsl-shaders="~~/shaders/ArtCNN_C4F32.glsl"
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"

[AnimeLanguageSwitch]
profile-cond=string.match((get("working-directory", "") .. "/" .. get("path", "")):lower():match("^(.*)[/\\]") or "", "anime") ~= nil
profile-restore=copy
alang=ja,jpn,jp,chi,zho,zh,chs,sc,cht,tc,eng,en
sub-ass-override=no

# PROFILES - OS-Specific Settings
[Windows]
profile-cond=get("working-directory", ""):match("^%a:") ~= nil
profile-restore=copy
screenshot-dir="C:/Users/Vell/Pictures/MPV-screenshots"
hwdec=d3d11va-copy

[Linux]
profile-cond=get("working-directory", ""):match("^/") ~= nil
profile-restore=copy
screenshot-dir="~/Pictures/MPV-screenshots"
hwdec=vulkan
gpu-context=waylandvk
ao=pipewire